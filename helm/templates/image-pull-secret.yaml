{{- if .Values.global.imageCredentials.createSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pivotal-stack.imagePullSecretName" . }}
  labels:
    {{- include "pivotal-stack.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ dict "auths" (dict
      (required "global.imageCredentials.registry is required when createSecret=true" .Values.global.imageCredentials.registry)
      (dict
        "username" (required "global.imageCredentials.username is required when createSecret=true" .Values.global.imageCredentials.username)
        "password" (required "global.imageCredentials.password is required when createSecret=true" .Values.global.imageCredentials.password)
        "email" (.Values.global.imageCredentials.email | default "")
        "auth" (printf "%s:%s"
          (required "global.imageCredentials.username is required when createSecret=true" .Values.global.imageCredentials.username)
          (required "global.imageCredentials.password is required when createSecret=true" .Values.global.imageCredentials.password) | b64enc)
      )
    ) | toJson | b64enc | quote }}
{{- end }}
