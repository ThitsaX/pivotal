{{- /*
  Sidecar-level x-forwarded-client-cert handling.

  Istio exposes forwardClientCertDetails through ProxyConfig only for gateways, so the
  proxy.istio.io/config annotation has no effect on an injected sidecar. Patching the
  inbound HTTP connection manager is the only way to set it on a workload.
*/}}
{{- if .Values.istio.envoyFilters.enabled }}
{{- range $filter := .Values.istio.envoyFilters.items }}
{{- if $filter.enabled }}
---
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: {{ $filter.name }}
  namespace: {{ $filter.namespace }}
  labels:
    {{- include "pivotal-stack.labels" $ | nindent 4 }}
spec:
  workloadSelector:
    labels:
      {{- toYaml $filter.workloadLabels | nindent 6 }}
  configPatches:
    - applyTo: NETWORK_FILTER
      match:
        context: SIDECAR_INBOUND
        listener:
          filterChain:
            filter:
              name: envoy.filters.network.http_connection_manager
      patch:
        operation: MERGE
        value:
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
            forward_client_cert_details: {{ $filter.forwardClientCertDetails }}
{{- end }}
{{- end }}
{{- end }}
