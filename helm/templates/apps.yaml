{{- $apps := list
  (dict "name" "web-inbound" "key" "webInbound" "containerPort" 3201 "includeFspiop" true "includeDb" true)
  (dict "name" "web-outbound" "key" "webOutbound" "containerPort" 3200 "includeFspiop" true "includeDb" true)
  (dict "name" "app-auditor" "key" "appAuditor" "includeDb" true)
  (dict "name" "report-worker" "key" "reportWorker" "includeDb" true)
  (dict "name" "web-pivotal" "key" "webPivotal" "containerPort" 3202 "includeDb" true)
  (dict "name" "portal" "key" "portal" "containerPort" 8080)
  (dict "name" "trust-manager" "key" "trustManager" "includeDb" true)
-}}

{{- range $app := $apps }}
{{- $cfg := index $.Values $app.key }}
{{- if $cfg.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $app.name }}
  labels:
    {{- include "pivotal-stack.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $app.name }}
spec:
  replicas: {{ $cfg.replicaCount }}
  revisionHistoryLimit: {{ $.Values.global.revisionHistoryLimit }}
  {{- /* A service pinned to a fixed per-pod identity cannot tolerate the overlap of a rolling
       update, so it may override the shared strategy. */}}
  strategy:
    {{- toYaml (default $.Values.global.deploymentStrategy $cfg.deploymentStrategy) | nindent 4 }}
  selector:
    matchLabels:
      {{- include "pivotal-stack.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: {{ $app.name }}
  template:
    metadata:
      labels:
        {{- include "pivotal-stack.selectorLabels" $ | nindent 8 }}
        app.kubernetes.io/component: {{ $app.name }}
      {{- with merge (deepCopy (default dict $cfg.podAnnotations)) (deepCopy (default dict $.Values.global.podAnnotations)) }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- include "pivotal-stack.imagePullSecrets" $ | nindent 6 }}
      {{- if $cfg.serviceAccount }}
      serviceAccountName: {{ $cfg.serviceAccount.name | default $app.name }}
      {{- end }}
      {{- with $.Values.global.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ $.Values.global.terminationGracePeriodSeconds }}
      {{- with $cfg.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.global.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.global.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.global.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ $app.name }}
          image: {{ include "pivotal-stack.image" (dict "global" $.Values.global "image" $cfg.image "component" $app.name) | quote }}
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}

          {{- with $cfg.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}

          {{- with $cfg.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}

          {{- if $app.containerPort }}
          ports:
            - name: http
              containerPort: {{ $app.containerPort }}
              protocol: TCP
          {{- end }}

          {{- with $cfg.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          
          env:
            {{- /* The service's own env is merged over the shared FSPIOP block, so a value set
                 on one service wins. Emitting both would leave duplicate names, and Kubernetes
                 keeps the last one -- the shared value would silently override the service. */}}
            {{- $shared := ternary $.Values.global.commonFspiopEnv dict (default false $app.includeFspiop) }}
            {{- include "pivotal-stack.envVars" (merge (deepCopy (default dict $cfg.env)) (deepCopy $shared)) | nindent 12 }}
            {{- if $app.includeDb }}
            {{- include "pivotal-stack.databaseEnv" $ | nindent 12 }}
            {{- include "pivotal-stack.databaseSecretEnv" $ | nindent 12 }}
            {{- end }}

          securityContext:
            {{- toYaml (default $.Values.global.containerSecurityContext $cfg.securityContext) | nindent 12 }}

          resources:
            {{- toYaml (default $.Values.global.defaultResources $cfg.resources) | nindent 12 }}

          {{- with $cfg.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}

          {{- with $cfg.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}

          {{- with $cfg.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}

{{- if $cfg.service }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $app.name }}
  labels:
    {{- include "pivotal-stack.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $app.name }}
spec:
  type: {{ $cfg.service.type }}
  selector:
    {{- include "pivotal-stack.selectorLabels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $app.name }}
  ports:
    - name: http
      port: {{ $cfg.service.port }}
      targetPort: http
      protocol: TCP
{{- end }}
{{- end }}
{{- end }}

# =========================
# CONNECTORS
# =========================

{{- range $connector := $.Values.connectors }}
{{- if $connector.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $connector.name }}
  labels:
    {{- include "pivotal-stack.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $connector.name }}
    {{- with $.Values.global.connectorLabel }}
    connector: {{ . }}
    {{- end }}
spec:
  replicas: {{ default 1 $connector.replicaCount }}
  revisionHistoryLimit: {{ $.Values.global.revisionHistoryLimit }}
  strategy:
    {{- toYaml (default $.Values.global.deploymentStrategy $connector.deploymentStrategy) | nindent 4 }}
  selector:
    matchLabels:
      {{- include "pivotal-stack.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: {{ $connector.name }}
  template:
    metadata:
      labels:
        {{- include "pivotal-stack.selectorLabels" $ | nindent 8 }}
        app.kubernetes.io/component: {{ $connector.name }}
        {{- with $.Values.global.connectorLabel }}
        connector: {{ . }}
        {{- end }}
      {{- $annotations := merge (deepCopy (default dict $connector.podAnnotations)) (deepCopy (default dict $.Values.global.podAnnotations)) }}
      {{- /* Java auto-instrumentation, on for every connector while tracing is on unless the
           connector opts out with tracing.enabled: false. */}}
      {{- if and $.Values.tracing.enabled (ne (dig "tracing" "enabled" true $connector) false) }}
      {{- $_ := set $annotations "instrumentation.opentelemetry.io/inject-java" "true" }}
      {{- end }}
      {{- with $annotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- include "pivotal-stack.imagePullSecrets" $ | nindent 6 }}
      {{- if $connector.serviceAccount }}
      serviceAccountName: {{ $connector.serviceAccount.name | default $connector.name }}
      {{- end }}

      {{- with $.Values.global.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      terminationGracePeriodSeconds: {{ $.Values.global.terminationGracePeriodSeconds }}

      {{- with $connector.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with $.Values.global.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with $.Values.global.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with $.Values.global.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      containers:
        - name: {{ $connector.name }}
          image: {{ include "pivotal-stack.image" (dict "global" $.Values.global "image" $connector.image "component" $connector.name) | quote }}
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}

          {{- with $connector.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}

          {{- with $connector.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}

          {{- with $connector.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}

          env:
            {{- /* Same merge as the services: the connector's own env wins over the shared block. */}}
            {{- include "pivotal-stack.envVars" (merge (deepCopy (default dict $connector.env)) (deepCopy $.Values.global.commonFspiopEnv)) | nindent 12 }}
            {{- if $connector.includeDb }}
            {{- include "pivotal-stack.databaseEnv" $ | nindent 12 }}
            {{- include "pivotal-stack.databaseSecretEnv" $ | nindent 12 }}
            {{- end }}

          securityContext:
            {{- toYaml (default $.Values.global.containerSecurityContext $connector.securityContext) | nindent 12 }}

          resources:
            {{- toYaml (default $.Values.global.defaultResources $connector.resources) | nindent 12 }}

          {{- with $connector.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}

          {{- with $connector.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}

          {{- with $connector.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}

{{- with $connector.secrets }}
{{- range $secretSuffix, $files := . }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $connector.name }}-{{ $secretSuffix }}
  labels:
    {{- include "pivotal-stack.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $connector.name }}
type: Opaque
stringData:
  {{- range $fileName, $content := $files }}
  {{ $fileName }}: |
    {{- $content | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
