{{/*
One ServiceAccount per component, so each workload has its own Kubernetes
identity. Vault's Kubernetes auth method binds a role to
bound_service_account_names + bound_service_account_namespaces; without a
dedicated account every pod authenticates as "default" and per-tenant scoping of
private keys is impossible.

Set <component>.serviceAccount.create=false when the account is managed outside
this chart (ArgoCD, a platform team, or an existing cluster).
*/}}
{{- $components := list
      (dict "values" .Values.webInbound       "default" "web-inbound")
      (dict "values" .Values.webOutbound      "default" "web-outbound")
      (dict "values" .Values.appAuditor       "default" "app-auditor")
      (dict "values" .Values.reportWorker     "default" "report-worker")
      (dict "values" .Values.webPivotal       "default" "web-pivotal")
      (dict "values" .Values.portal           "default" "portal")
      (dict "values" .Values.wallet1Connector "default" "wallet1-connector")
      (dict "values" .Values.wallet2Connector "default" "wallet2-connector")
      (dict "values" .Values.wallet3Connector "default" "wallet3-connector")
-}}
{{- range $component := $components }}
{{- $values := $component.values | default dict }}
{{- $serviceAccount := $values.serviceAccount | default dict }}
{{- if and $values.enabled $serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $serviceAccount.name | default $component.default }}
  labels:
    {{- include "pivotal-stack.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component.default }}
{{- end }}
{{- end }}
