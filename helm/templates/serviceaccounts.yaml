{{/*
One ServiceAccount per workload, so each has its own Kubernetes identity.

Vault's Kubernetes auth method binds a role to bound_service_account_names plus
bound_service_account_namespaces. Without a dedicated account every pod in this namespace
authenticates as "default", which makes the binding namespace-wide: any workload here could
read any other's private keys. Per-tenant scoping is only meaningful once the accounts differ.

Set <component>.serviceAccount.create=false where the account is managed outside this chart.
*/}}
{{- $components := list
      (dict "values" .Values.webInbound   "default" "web-inbound")
      (dict "values" .Values.webOutbound  "default" "web-outbound")
      (dict "values" .Values.appAuditor   "default" "app-auditor")
      (dict "values" .Values.reportWorker "default" "report-worker")
      (dict "values" .Values.webPivotal   "default" "web-pivotal")
      (dict "values" .Values.portal       "default" "portal")
      (dict "values" .Values.trustManager "default" "trust-manager")
-}}
{{- range $component := $components }}
{{- $values := $component.values | default dict }}
{{- $serviceAccount := $values.serviceAccount | default dict }}
{{- if and $values.enabled $serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $serviceAccount.name | default $component.default }}
  labels:
    {{- include "pivotal-stack.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component.default }}
{{- end }}
{{- end }}

{{/*
Connectors get one each as well. Each is a participant that signs as itself, so this is the
identity Vault scopes its crypto-user credential and key reference to -- the boundary that
stops one participant reaching another's signing key.
*/}}
{{- range $connector := .Values.connectors }}
{{- $serviceAccount := $connector.serviceAccount | default dict }}
{{- if and $connector.enabled $serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $serviceAccount.name | default $connector.name }}
  labels:
    {{- include "pivotal-stack.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $connector.name }}
{{- end }}
{{- end }}
