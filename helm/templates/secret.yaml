{{- if not .Values.global.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pivotal-stack.secretName" . }}
  labels:
    {{- include "pivotal-stack.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.global.secrets.mysqlRootPasswordKey }}: {{ .Values.global.secrets.mysqlRootPassword | quote }}
  {{ .Values.global.secrets.dbWritePasswordKey }}: {{ .Values.global.secrets.dbWritePassword | quote }}
  {{ .Values.global.secrets.dbReadPasswordKey }}: {{ .Values.global.secrets.dbReadPassword | quote }}
{{- end }}
