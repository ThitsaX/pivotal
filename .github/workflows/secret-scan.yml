name: Secret scan

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan current tree
        run: |
          docker run --rm \
            --volume "$PWD:/repo" \
            --workdir /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            dir . \
            --max-decode-depth 3 \
            --max-archive-depth 2 \
            --redact=100 \
            --no-banner \
            --no-color

      - name: Select commit range
        id: scan-range
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base_sha="$PR_BASE_SHA"
          elif [ -n "$EVENT_BEFORE" ] && ! printf '%s' "$EVENT_BEFORE" | grep -Eq '^0+$'; then
            base_sha="$EVENT_BEFORE"
          else
            base_sha="$(git merge-base HEAD "origin/$DEFAULT_BRANCH")"
          fi

          printf 'range=%s..%s\n' "$base_sha" "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Scan introduced commits
        env:
          SCAN_RANGE: ${{ steps.scan-range.outputs.range }}
        run: |
          docker run --rm \
            --volume "$PWD:/repo" \
            --workdir /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git . \
            --log-opts="$SCAN_RANGE" \
            --max-decode-depth 3 \
            --max-archive-depth 2 \
            --redact=100 \
            --no-banner \
            --no-color
